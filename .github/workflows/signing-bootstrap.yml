name: Initialize permanent signing identity
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/signing-bootstrap.yml', 'tools/signing.sh']
permissions:
  contents: write
concurrency:
  group: soop-signing-bootstrap
  cancel-in-progress: false
jobs:
  bootstrap:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check initial secret availability
        id: ready
        env:
          SOOP_SIGNING_PASSPHRASE: ${{ secrets.SOOP_SIGNING_PASSPHRASE }}
        run: |
          if [[ -n "$SOOP_SIGNING_PASSPHRASE" && ! -e signing/release.p12.gpg ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Signing bootstrap skipped: secret absent or identity already initialized.'
          fi
      - name: Refuse regeneration or existing releases
        if: steps.ready.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test ! -e signing/release.p12.gpg
          test ! -e signing/certificate.sha256
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq length)" = 0
      - name: Generate and encrypt on runner
        if: steps.ready.outputs.ready == 'true'
        env:
          SOOP_SIGNING_PASSPHRASE: ${{ secrets.SOOP_SIGNING_PASSPHRASE }}
        run: bash tools/signing.sh bootstrap
      - name: Preserve encrypted identity and public certificate
        if: steps.ready.outputs.ready == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add signing/release.p12.gpg signing/certificate.pem signing/certificate.sha256
          git commit -m 'chore: initialize permanent release signing identity'
          git push origin HEAD:main
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/main | cut -f1)"
      - name: Remove plaintext signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/soop-signing"
